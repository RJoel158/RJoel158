<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
      font-weight: 600;
      font-size: 15px;
      fill: #58a6ff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #8b949e;
      font-weight: 400;
    }
    .badge-rect {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Menlo, monospace;
      font-size: 11px;
      fill: #c9d1d9;
      font-weight: 500;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="230" rx="14" fill="url(#bg-grad)"/>
  
  <!-- Subtle Dot Grid -->
  <rect width="900" height="230" rx="14" fill="url(#dot-grid)"/>

  <!-- Ambient Glows -->
  <rect width="900" height="230" rx="14" fill="url(#glow-cyan)"/>
  <rect width="900" height="230" rx="14" fill="url(#glow-indigo)"/>

  <!-- Border -->
  <rect width="898" height="228" x="1" y="1" rx="13" fill="none" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top Window Decoration Dots -->
  <circle cx="36" cy="32" r="5" fill="#f85149" fill-opacity="0.8"/>
  <circle cx="52" cy="32" r="5" fill="#d29922" fill-opacity="0.8"/>
  <circle cx="68" cy="32" r="5" fill="#3fb950" fill-opacity="0.8"/>
  <text x="92" y="36" font-family="'SF Mono', monospace" font-size="11" fill="#6e7681">rjoel158 / profile</text>

  <!-- Main Divider Accent Line -->
  <line x1="32" y1="52" x2="868" y2="52" stroke="url(#accent-line)" stroke-width="1"/>

  <!-- Content -->
  <text x="36" y="108" class="title">Joel</text>
  <text x="36" y="136" class="subtitle">Software Engineering &amp; Computer Science</text>
  <text x="36" y="164" class="tagline">Designing and building performant web applications with clean architecture and modern standards.</text>

  <!-- Metadata Badges -->
  <g transform="translate(36, 184)">
    <rect width="118" height="26" class="badge-rect"/>
    <text x="12" y="17" class="badge-text">FULL-STACK WEB</text>
  </g>
  <g transform="translate(164, 184)">
    <rect width="144" height="26" class="badge-rect"/>
    <text x="12" y="17" class="badge-text">CLEAN ARCHITECTURE</text>
  </g>
  <g transform="translate(318, 184)">
    <rect width="168" height="26" class="badge-rect"/>
    <text x="12" y="17" class="badge-text">CONTINUOUS LEARNING</text>
  </g>
</svg>
